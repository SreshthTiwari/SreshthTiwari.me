<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Sreshth Tiwari">
  <title>Contact — Sreshth Tiwari</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --text: #f4f4f0;
      --muted: rgba(244, 244, 240, 0.42);
      --line: rgba(244, 244, 240, 0.14);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      cursor: none;
      overflow-x: hidden;
    }

    a,
    button {
      color: inherit;
      font: inherit;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 28px 34px;
    }

    .logo {
      color: white;
      text-decoration: none;

      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .menu-button {
      border: 0;
      background: transparent;
      color: white;

      cursor: none;

      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .menu-button span {
      display: inline-block;
      margin-left: 5px;
      transition: transform 250ms ease;
    }

    .menu-button:hover span {
      transform: rotate(90deg);
    }

    .menu {
      position: fixed;
      inset: 0;
      z-index: 3000;

      display: flex;
      align-items: center;

      padding: 8vw;

      background: #101010;

      transform: translateY(-100%);

      transition:
        transform 700ms
        cubic-bezier(0.76, 0, 0.24, 1);
    }

    .menu.open {
      transform: translateY(0);
    }

    .menu-close {
      position: absolute;
      top: 28px;
      right: 34px;

      border: 0;
      background: transparent;
      color: white;

      cursor: pointer;

      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .menu nav {
      display: flex;
      flex-direction: column;
    }

    .menu nav a {
      width: fit-content;

      color: white;
      text-decoration: none;

      font-family: "Playfair Display", serif;
      font-size: clamp(52px, 8vw, 125px);
      line-height: 0.94;

      opacity: 0.35;

      transition:
        opacity 250ms ease,
        transform 250ms ease;
    }

    .menu nav a:hover {
      opacity: 1;
      transform: translateX(14px);
    }

    .contact-page {
      position: relative;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        130px
        7vw
        35px;

      overflow: hidden;
    }


    /* adapted from ChatGPT */
    /* builds radar effect from one main circle and two pseudo element circles
       signal ring uses keyframe scaling and opacity to make pulses expand from cursor */
    .radar {
      position: fixed;

      left: 0;
      top: 0;

      width: 500px;
      height: 500px;

      z-index: 0;

      transform:
        translate(-50%, -50%);

      border:
        1px solid
        rgba(255,255,255,0.035);

      border-radius: 50%;

      pointer-events: none;
    }

    .radar::before,
    .radar::after {
      content: "";

      position: absolute;
      left: 50%;
      top: 50%;

      border:
        1px solid
        rgba(255,255,255,0.04);

      border-radius: 50%;

      transform:
        translate(-50%, -50%);
    }

    .radar::before {
      width: 65%;
      height: 65%;
    }

    .radar::after {
      width: 32%;
      height: 32%;
    }

    .signal-ring {
      position: fixed;

      left: 0;
      top: 0;

      width: 30px;
      height: 30px;

      z-index: 0;

      border:
        1px solid
        rgba(255,255,255,0.12);

      border-radius: 50%;

      transform:
        translate(-50%, -50%)
        scale(0);

      pointer-events: none;

      opacity: 0;
    }

    .signal-ring.pulse {
      animation:
        signalPulse
        1.1s
        ease-out
        forwards;
    }

    @keyframes signalPulse {
      0% {
        transform:
          translate(-50%, -50%)
          scale(0.2);

        opacity: 0.25;
      }

      100% {
        transform:
          translate(-50%, -50%)
          scale(8);

        opacity: 0;
      }
    }

    #background-word {
      position: fixed;

      left: 50%;
      top: 50%;

      z-index: 0;

      transform:
        translate(-50%, -50%);

      color:
        rgba(255,255,255,0.025);

      font-family:
        "Playfair Display",
        serif;

      font-size: clamp(
        130px,
        22vw,
        380px
      );

      font-weight: 500;

      letter-spacing: -0.07em;

      white-space: nowrap;

      pointer-events: none;

      opacity: 0;

      transition:
        opacity 350ms ease,
        transform 500ms
        cubic-bezier(0.16,1,0.3,1);
    }

    #background-word.visible {
      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1.03);
    }

    .intro {
      position: relative;
      z-index: 5;

      margin-bottom: clamp(
        55px,
        8vh,
        100px
      );
    }

    .eyebrow {
      display: block;

      margin-bottom: 17px;

      color: var(--muted);

      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .intro h1 {
      font-family:
        "Playfair Display",
        serif;

      font-size: clamp(
        58px,
        8vw,
        125px
      );

      font-weight: 500;

      line-height: 0.87;
      letter-spacing: -0.055em;
    }

    .intro h1 em {
      font-weight: 500;
    }

    .intro p {
      max-width: 430px;

      margin-top: 26px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;
    }

    .contacts {
      position: relative;
      z-index: 5;

      width: 100%;

      margin-top: auto;
    }

    .contact-row {
      position: relative;

      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding:
        clamp(20px, 2.5vh, 32px)
        0;

      border-top:
        1px solid var(--line);

      color: white;
      text-decoration: none;

      cursor: none;

      transform: translate(0, 0);

      transition:
        border-color 250ms ease;
    }

    .contact-row:last-child {
      border-bottom:
        1px solid var(--line);
    }

    .contact-row:hover {
      border-color:
        rgba(255,255,255,0.5);
    }

    .contact-name {
      font-family:
        "Playfair Display",
        serif;

      font-size: clamp(
        32px,
        4vw,
        62px
      );

      line-height: 1;

      letter-spacing: -0.035em;

      transition:
        letter-spacing 450ms
        cubic-bezier(0.16,1,0.3,1);
    }

    .contact-row:hover
    .contact-name {
      letter-spacing: 0.015em;
    }

    .contact-value {
      display: flex;
      align-items: center;
      gap: 18px;

      color: var(--muted);

      font-size: 10px;
      letter-spacing: 0.08em;

      transition:
        color 250ms ease;
    }

    .contact-row:hover
    .contact-value {
      color: white;
    }

    .arrow {
      display: inline-block;

      font-size: 16px;

      transition:
        transform 300ms ease;
    }

    .contact-row:hover
    .arrow {
      transform:
        translate(4px, -4px);
    }

    .copy-row {
      border: 0;
      border-top:
        1px solid var(--line);

      background: transparent;

      text-align: left;
    }

    .copy-row:last-child {
      border-bottom:
        1px solid var(--line);
    }

    #copy-feedback {
      position: absolute;
      left: 0;
      top: 50%;

      transform:
        translateY(-50%);

      font-family:
        "Playfair Display",
        serif;

      font-size: clamp(
        32px,
        4vw,
        62px
      );

      letter-spacing: -0.035em;

      opacity: 0;

      pointer-events: none;

      transition: opacity 250ms ease;
    }

    .copy-row.copied
    .contact-name,
    .copy-row.copied
    .contact-value {
      opacity: 0;
    }

    .copy-row.copied
    #copy-feedback {
      opacity: 1;
    }

    .footer {
      position: relative;
      z-index: 5;

      display: flex;
      justify-content: space-between;

      padding-top: 22px;

      color:
        rgba(255,255,255,0.27);

      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    #cursor {
      position: fixed;

      left: 0;
      top: 0;

      z-index: 5000;

      display: flex;
      align-items: center;

      pointer-events: none;

      opacity: 0;

      transition:
        opacity 200ms ease;
    }

    #cursor.visible {
      opacity: 1;
    }

    .cursor-circle {
      width: 28px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,0.65);

      border-radius: 50%;

      transition:
        transform 300ms ease,
        background 300ms ease;
    }

    .cursor-dot {
      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: white;
    }

    #cursor-text {
      margin-left: 11px;

      color: white;

      white-space: nowrap;

      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #cursor.action
    .cursor-circle {
      transform: scale(1.25);

      background:
        rgba(255,255,255,0.08);
    }
/* adapted from ChatGPT */

/* i wanted to make the website repsonsive across mobile deivces, so i had AI change the sizes of elements accordingly */

/* detects screens below 700px using media query, hides mouse cursor,
   resizes layout, and displays touch-based image switch button */

    @media (max-width: 760px) {

      body {
        cursor: auto;
      }

      #cursor,
      .radar,
      .signal-ring {
        display: none;
      }

      .site-header {
        padding: 22px;
      }

      .contact-page {
        min-height: 100svh;

        padding:
          110px
          22px
          25px;
      }

      .intro {
        margin-bottom: 55px;
      }

      .intro h1 {
        font-size: 16vw;
      }

      .contact-row {
        padding: 23px 0;
      }

      .contact-name {
        font-size: 34px;
      }

      .contact-value {
        font-size: 0;
      }

      .contact-value .arrow {
        font-size: 18px;
      }

      .footer {
        margin-top: 20px;

        flex-direction: column;
        gap: 7px;
      }

      #background-word {
        font-size: 34vw;
      }
    }

  </style>
</head>

<body>

  <header class="site-header">

    <a
      class="logo"
      href="index.html"
    >
      Sreshth Tiwari
    </a>

    <button
      class="menu-button"
      id="menu-open"
    >
      Menu <span>+</span>
    </button>

  </header>

  <div
    class="menu"
    id="menu"
  >

    <button
      class="menu-close"
      id="menu-close"
    >
      Close ×
    </button>

    <nav>
      <a href="index.html">
        Home
      </a>

      <a href="projects.html">
        Projects
      </a>

      <a href="research.html">
        Research
      </a>

      <a href="contact.html">
        Contact
      </a>
    </nav>

  </div>

  <main class="contact-page">

    <div
      class="radar"
      id="radar"
    ></div>

    <div
      class="signal-ring"
      id="signal-ring"
    ></div>

    <div id="background-word">
      HELLO
    </div>

    <section class="intro">

      <span class="eyebrow">

      </span>

      <h1>
        <em>Reach Out</em>
      </h1>

      <p>
        I'd love to hear from you!! :)
      </p>

    </section>

    <!-- adapted from ChatGPT -->
    <!-- builds contact rows with data attributes that store hover word and cursor label
         javascript reads those values to change background text and cursor feedback -->
    <section class="contacts">

      <a
        class="contact-row magnetic"
        href="https://linkedin.com/in/SreshthTiwari"
        target="_blank"
        rel="noopener noreferrer"
        data-word="CONNECT"
        data-cursor="Connect ↗"
      >

        <span class="contact-name">
          LinkedIn
        </span>

        <span class="contact-value">

          /in/SreshthTiwari

          <span class="arrow">
            ↗
          </span>

        </span>

      </a>

      <a
        class="contact-row magnetic"
        href="https://github.com/SreshthTiwari"
        target="_blank"
        rel="noopener noreferrer"
        data-word="BUILD"
        data-cursor="Explore ↗"
      >

        <span class="contact-name">
          GitHub
        </span>

        <span class="contact-value">

          @SreshthTiwari

          <span class="arrow">
            ↗
          </span>

        </span>

      </a>

            <a
        class="contact-row magnetic"
        href="mailto:sreshth.tiwari.28@dartmouth.edu"
        data-word="EMAIL"
        data-cursor="Say hello"
      >

        <span class="contact-name">
          Email
        </span>

        <span class="contact-value">

          sreshth.tiwari.28@dartmouth.edu

          <span class="arrow">
            ↗
          </span>

        </span>

      </a>

      <button
        class="contact-row copy-row magnetic"
        id="copy-email"
        data-word="COPY"
        data-cursor="Copy email"
      >

        <span class="contact-name">
          Copy Email
        </span>

        <span class="contact-value">

          One click

          </span>

        <span id="copy-feedback">

        </span>

    </section>

    <footer class="footer">

      <span>
        Hanover, New Hampshire
      </span>

      <span>
        Dartmouth College
      </span>

    </footer>

  </main>

  <div id="cursor">

    <div class="cursor-circle">
      <div class="cursor-dot"></div>
    </div>

    <span id="cursor-text">
      Say hello
    </span>

  </div>

  <script>

    const cursor =
      document.getElementById("cursor");

    const cursorText =
      document.getElementById("cursor-text");

    const radar =
      document.getElementById("radar");

    const signalRing =
      document.getElementById("signal-ring");

    const backgroundWord =
      document.getElementById("background-word");

    const magneticRows =
      document.querySelectorAll(".magnetic");

    const copyEmail =
      document.getElementById("copy-email");

    const menu =
      document.getElementById("menu");

    const menuOpen =
      document.getElementById("menu-open");

    const menuClose =
      document.getElementById("menu-close");

    let mouseX = 0;
    let mouseY = 0;

    let radarX = 0;
    let radarY = 0;

    let lastPulse = 0;

    document.addEventListener(
      "mousemove",
      event => {

        mouseX = event.clientX;
        mouseY = event.clientY;

        cursor.classList.add(
          "visible"
        );

        cursor.style.left =
          `${mouseX}px`;

        cursor.style.top =
          `${mouseY}px`;

        const now =
          performance.now();

        if (
          now - lastPulse >
          850
        ) {

          signalRing.classList.remove(
            "pulse"
          );

          signalRing.style.left =
            `${mouseX}px`;

          signalRing.style.top =
            `${mouseY}px`;

          void signalRing.offsetWidth;

          signalRing.classList.add(
            "pulse"
          );

          lastPulse = now;
        }

      }
    );

    document.addEventListener(
      "mouseleave",
      () => {
        cursor.classList.remove(
          "visible"
        );
      }
    );

    // adapted from ChatGPT
    // moves radar toward current mouse position by adding 8 percent of remaining distance each frame
    // requestanimationframe repeats this so radar follows cursor with smooth delay instead of jumping
    function animateRadar() {

      radarX +=
        (mouseX - radarX) *
        0.08;

      radarY +=
        (mouseY - radarY) *
        0.08;

      radar.style.left =
        `${radarX}px`;

      radar.style.top =
        `${radarY}px`;

      requestAnimationFrame(
        animateRadar
      );
    }

    animateRadar();

    // adapted from ChatGPT
    // adds hover behavior to every contact row and reads data attributes for background word and cursor text
    // mouse position inside each row is converted into small x and y translation to create magnetic movement
    magneticRows.forEach(
      row => {

        row.addEventListener(
          "mouseenter",
          () => {

            const word =
              row.dataset.word;

            const cursorLabel =
              row.dataset.cursor;

            backgroundWord.textContent =
              word;

            backgroundWord.classList.add(
              "visible"
            );

            cursor.classList.add(
              "action"
            );

            cursorText.textContent =
              cursorLabel;

          }
        );

        row.addEventListener(
          "mousemove",
          event => {

            const rect =
              row.getBoundingClientRect();

            const x =
              event.clientX -
              rect.left -
              rect.width / 2;

            const y =
              event.clientY -
              rect.top -
              rect.height / 2;

            const moveX =
              x * 0.018;

            const moveY =
              y * 0.06;

            row.style.transform =
              `translate(
                ${moveX}px,
                ${moveY}px
              )`;

          }
        );

        row.addEventListener(
          "mouseleave",
          () => {

            row.style.transition =
              `
                transform
                500ms
                cubic-bezier(
                  0.16,
                  1,
                  0.3,
                  1
                )
              `;

            row.style.transform =
              "translate(0, 0)";

            backgroundWord.classList.remove(
              "visible"
            );

            cursor.classList.remove(
              "action"
            );

            cursorText.textContent =
              "Say hello";

            setTimeout(
              () => {
                row.style.transition =
                  "";
              },
              500
            );

          }
        );

      }
    );

    // adapted from ChatGPT
    // copies email with clipboard api and falls back to temporary textarea if clipboard write fails
    // copied class and timeout show feedback briefly before returning row to normal state
    copyEmail.addEventListener(
      "click",
      async () => {

        const email =
          "sreshth.tiwari.28@dartmouth.edu";

        try {

          await navigator.clipboard.writeText(
            email
          );

        } catch {

          const textarea =
            document.createElement(
              "textarea"
            );

          textarea.value =
            email;

          document.body.appendChild(
            textarea
          );

          textarea.select();

          document.execCommand(
            "copy"
          );

          textarea.remove();

        }

        copyEmail.classList.add(
          "copied"
        );

        backgroundWord.textContent =
          "COPIED";

        backgroundWord.classList.add(
          "visible"
        );

        cursorText.textContent =
          "Copied ✓";

        setTimeout(
          () => {

            copyEmail.classList.remove(
              "copied"
            );

            backgroundWord.textContent =
              "COPY";

            cursorText.textContent =
              "Copy email";

          },
          1700
        );

      }
    );

    menuOpen.addEventListener(
      "click",
      () => {

        menu.classList.add(
          "open"
        );

        cursorText.textContent =
          "Explore";

      }
    );

    menuClose.addEventListener(
      "click",
      () => {

        menu.classList.remove(
          "open"
        );

        cursorText.textContent =
          "Say hello";

      }
    );

  </script>

</body>
</html>
